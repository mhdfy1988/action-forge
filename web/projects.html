<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色项目 · 动作工坊</title><link rel="stylesheet" href="/assets/style.css"><script type="module" src="/assets/project-workspace.js"></script></head>
<body class="project-page">
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4M4 17l8 4 8-4"/></svg></span><span>动作工坊</span><span class="topbar-section">角色项目</span></div><div class="topbar-actions"><a class="topbar-link" href="/workflow">工作流画布</a><a class="topbar-link" href="/">单动作工具</a><span class="local"><i></i> 本机项目</span></div></header>
<main class="project-shell">
 <aside class="project-library">
  <div class="project-library-head"><strong>项目</strong><button id="new-project" class="icon-button" title="新建角色项目" aria-label="新建角色项目">＋</button></div>
  <div id="project-list" class="project-list" role="listbox" aria-label="角色项目"></div>
 </aside>
 <section id="project-empty" class="project-empty"><span class="project-empty-mark">◇</span><h1>选择一个角色项目</h1><p>每个项目保存一个角色及其全部动作。</p><button id="empty-create" class="button primary">新建项目</button></section>
 <section id="project-editor" class="project-editor" hidden>
  <div class="project-editor-head">
   <div class="project-title-fields"><input id="project-name" maxlength="80" aria-label="项目名称"><span id="project-revision"></span></div>
   <div class="project-save-state"><span id="project-state">已保存</span><button id="godot-preview" class="button secondary" disabled>Godot 预览</button><button id="export-character-project" class="button secondary">导出角色包</button><button id="save-project" class="button primary" disabled>保存项目</button></div>
  </div>
  <div class="project-body">
   <aside class="action-rail">
    <div class="action-rail-head"><div><strong>动作</strong><span id="action-count"></span></div><button id="add-action" class="icon-button" aria-label="添加动作" title="添加动作">＋</button></div>
    <div id="action-list" class="action-list"></div>
   </aside>
   <section id="action-empty" class="action-empty"><span>还没有动作</span><button id="empty-add-action" class="button secondary">添加第一个动作</button></section>
   <section id="action-editor" class="action-editor" hidden>
    <div class="action-settings">
     <div class="action-heading"><div><span id="action-id"></span><input id="action-name" maxlength="80" aria-label="动作名称"></div><div class="action-order"><button id="action-up" class="icon-button" title="向上移动" aria-label="动作向上移动">↑</button><button id="action-down" class="icon-button" title="向下移动" aria-label="动作向下移动">↓</button><button id="delete-action" class="text-button danger">删除动作</button></div></div>
      <div class="action-parameters"><label>播放方式 <select id="action-playback-mode"><option value="constant-fps">固定帧率</option><option value="per-frame">逐帧时长</option></select></label><label id="action-fps-wrap">帧率 <input id="action-fps" type="number" min="1" max="60" step="1"><span>帧/秒</span></label><label class="switch-label"><input id="action-loop" type="checkbox">循环</label><span id="action-total-duration"></span><span id="action-source"></span><button id="open-calibration" class="button secondary">跨动作校准</button></div>
    </div>
    <div class="action-preview">
     <div class="project-stage checker"><img id="project-frame" alt="动作帧预览" hidden><span id="project-frame-empty">当前动作还没有帧</span></div>
     <div class="project-playback"><button id="project-prev" class="icon-button" aria-label="上一帧">←</button><button id="project-play" class="text-button">▷ 播放</button><button id="project-next" class="icon-button" aria-label="下一帧">→</button><span id="project-position">—</span></div>
    </div>
     <div id="project-frames" class="project-frames" aria-label="动作帧列表"></div>
     <section class="frame-event-panel" aria-label="当前帧事件"><header><strong>帧事件</strong><span id="frame-event-context">选择一个启用帧</span><span id="event-playback-log">播放触发记录</span><button id="add-frame-event" class="button secondary" disabled>＋ 添加事件</button></header><div id="frame-event-list"></div></section>
   </section>
  </div>
  <footer class="project-footer"><label>角色名称 <input id="character-name" maxlength="80"></label><span id="project-message" role="status"></span><span id="project-error" role="alert"></span></footer>
 </section>
</main>

<dialog id="calibration-dialog" class="calibration-dialog" aria-labelledby="calibration-title"><div class="calibration-layout"><div class="calibration-head"><div><h2 id="calibration-title">跨动作校准</h2><span id="calibration-context"></span></div><button id="close-calibration" class="icon-button" aria-label="关闭">×</button></div><div class="calibration-tools"><label>基准动作<select id="baseline-action"></select></label><label>基准帧<select id="baseline-frame"></select></label><label>当前动作帧<select id="target-frame"></select></label><button id="calibration-play" class="button secondary">▷ 播放当前动作</button><span class="calibration-hint">半透明影像为基准帧</span></div><div class="calibration-body"><div id="calibration-stage" class="calibration-stage"><canvas id="calibration-canvas" aria-label="动作叠图校准画布"></canvas></div><aside class="calibration-controls"><fieldset><legend>共享画布</legend><div class="calibration-row"><label>宽 <input id="canvas-width" type="number" min="1" max="8192" value="512"></label><label>高 <input id="canvas-height" type="number" min="1" max="8192" value="512"></label></div><div class="calibration-row"><label>原点 X <input id="origin-x" type="number" min="0"></label><label>Y <input id="origin-y" type="number" min="0"></label></div><button id="set-origin-mode" class="button secondary">在画布上点选原点</button></fieldset><fieldset><legend>锚点与动作调整</legend><div class="calibration-row"><label>整体比例 <input id="action-scale" type="number" min="0.05" max="20" step="0.01" value="1"></label></div><div class="calibration-row"><label>偏移 X <input id="action-offset-x" type="number" step="1" value="0"></label><label>Y <input id="action-offset-y" type="number" step="1" value="0"></label></div><div class="calibration-buttons"><button id="set-baseline-anchor-mode" class="button secondary">标记基准锚点</button><button id="set-target-anchor-mode" class="button secondary">标记当前锚点</button></div><button id="confirm-baseline" class="button primary">设为角色基准</button></fieldset><p id="calibration-status" role="status"></p></aside></div><div class="calibration-foot"><span>调整只作用于当前动作整组帧，不改写源图片。</span><button id="save-calibration" class="button primary">保存项目</button></div></div></dialog>

<dialog id="create-project-dialog" class="compact-dialog" aria-labelledby="create-project-title"><form method="dialog"><div class="dialog-head"><h2 id="create-project-title">新建角色项目</h2><button value="cancel" formnovalidate class="icon-button" aria-label="关闭">×</button></div><div class="dialog-fields"><label>项目 ID<input id="create-project-id" required pattern="[a-z0-9][a-z0-9._-]{0,63}" placeholder="raccoon-actions"></label><label>项目名称<input id="create-project-name" required maxlength="80" placeholder="浣熊动作"></label><label>角色 ID<input id="create-character-id" required pattern="[a-z0-9][a-z0-9._-]{0,63}" placeholder="raccoon"></label><label>角色名称<input id="create-character-name" required maxlength="80" placeholder="浣熊"></label></div><div class="dialog-actions"><button value="cancel" formnovalidate class="button secondary">取消</button><button id="confirm-create" value="default" class="button primary">创建</button></div></form></dialog>

<dialog id="action-dialog" class="compact-dialog" aria-labelledby="action-dialog-title"><form method="dialog"><div class="dialog-head"><h2 id="action-dialog-title">添加动作</h2><button value="cancel" formnovalidate class="icon-button" aria-label="关闭">×</button></div><div class="dialog-fields"><label>动作 ID<input id="new-action-id" required pattern="[a-z0-9][a-z0-9._-]{0,63}" placeholder="run"></label><label>动作名称<input id="new-action-name" required maxlength="80" placeholder="跑步"></label><label>播放速度<input id="new-action-fps" type="number" required min="1" max="60" value="12"></label></div><div class="dialog-actions"><button value="cancel" formnovalidate class="button secondary">取消</button><button id="confirm-action" value="default" class="button primary">添加</button></div></form></dialog>

<dialog id="frame-event-dialog" class="compact-dialog" aria-labelledby="frame-event-title"><form method="dialog"><div class="dialog-head"><h2 id="frame-event-title">添加帧事件</h2><button value="cancel" formnovalidate class="icon-button" aria-label="关闭">×</button></div><div class="dialog-fields"><label>事件类型<input id="event-type" required maxlength="64" pattern="[a-z0-9][a-z0-9._-]{0,63}" list="event-type-options" placeholder="footstep"></label><datalist id="event-type-options"><option value="footstep"><option value="hit"><option value="effect"></datalist><label>所在帧<input id="event-frame-label" readonly></label><label class="event-parameters-field">事件参数（JSON对象）<textarea id="event-parameters" rows="5" spellcheck="false">{}</textarea></label></div><div id="event-error" role="alert"></div><div class="dialog-actions"><button value="cancel" formnovalidate class="button secondary">取消</button><button id="confirm-frame-event" value="default" class="button primary">保存事件</button></div></form></dialog>

<dialog id="godot-preview-dialog" class="compact-dialog" aria-labelledby="godot-preview-title"><form method="dialog"><div class="dialog-head"><div><h2 id="godot-preview-title">Godot 实时预览</h2><span>在本机 Godot 预览工程中填写以下配对信息</span></div><button value="cancel" formnovalidate class="icon-button" aria-label="关闭">×</button></div><div class="dialog-fields"><label>WebSocket 地址<input id="preview-websocket-url" readonly></label><label>一次性令牌<input id="preview-token" readonly></label></div><div class="dialog-actions"><button id="copy-preview-url" type="button" class="button secondary">复制地址</button><button id="copy-preview-token" type="button" class="button secondary">复制令牌</button><button value="cancel" formnovalidate class="button primary">完成</button></div></form></dialog>

<dialog id="migration-dialog" class="compact-dialog migration-dialog" aria-labelledby="migration-title"><form method="dialog"><div class="dialog-head"><div><h2 id="migration-title">加入当前透明动作</h2><span>批次只在本次服务运行期间有效</span></div><button value="cancel" formnovalidate class="icon-button" aria-label="关闭">×</button></div><div class="dialog-fields"><label>目标项目<select id="migration-project"><option value="">新建项目</option></select></label><label>项目 ID<input id="migration-project-id" required pattern="[a-z0-9][a-z0-9._-]{0,63}"></label><label>项目名称<input id="migration-project-name" required maxlength="80"></label><label>角色 ID<input id="migration-character-id" required pattern="[a-z0-9][a-z0-9._-]{0,63}" value="character-1"></label><label>角色名称<input id="migration-character-name" required maxlength="80" value="角色"></label><label>动作 ID<input id="migration-action-id" required pattern="[a-z0-9][a-z0-9._-]{0,63}" placeholder="run"></label><label>动作名称<input id="migration-action-name" required maxlength="80" placeholder="跑步"></label><label>播放速度<input id="migration-fps" type="number" required min="1" max="60" value="12"></label></div><div id="migration-error" role="alert"></div><div class="dialog-actions"><button value="cancel" formnovalidate class="button secondary">稍后处理</button><button id="confirm-migration" value="default" class="button primary">加入项目</button></div></form></dialog>
</body>
</html>
